name: CI
on: [push, pull_request]
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _sistema/merovan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _sistema/merovan/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
